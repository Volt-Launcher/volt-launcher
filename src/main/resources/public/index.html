<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Launcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            background-color: #34495e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        input, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #7f8c8d;
            border-radius: 4px;
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .profile-list {
            margin-top: 15px;
        }
        .profile-item {
            background-color: #7f8c8d;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Minecraft Launcher</h1>
            <p>Kotlin-basierter Minecraft Launcher</p>
        </div>

        <div class="section">
            <h2>🔐 Authentifizierung</h2>
            <button onclick="startMicrosoftLogin()">Microsoft Login</button>
            <div id="auth-status">Status: Nicht eingeloggt</div>
        </div>

        <div class="section">
            <h2>📋 Profile verwalten</h2>
            <div>
                <input type="text" id="profile-name" placeholder="Profil-Name">
                <select id="version-select">
                    <option value="">Version wählen...</option>
                </select>
                <select id="loader-select">
                    <option value="vanilla">Vanilla</option>
                </select>
                <button onclick="createProfile()">Profil erstellen</button>
            </div>
            <div class="profile-list" id="profiles"></div>
        </div>

        <div class="section">
            <h2>🚀 Spiel starten</h2>
            <button onclick="startMinecraft()" id="launch-btn" disabled>Minecraft starten</button>
            <div id="launch-status"></div>
        </div>

        <div class="section">
            <h2>⬇️ Versionen verwalten</h2>
            <button onclick="loadVersions()">Versionen laden</button>
            <div id="versions"></div>
        </div>
    </div>

    <script>
        let selectedProfile = null;

        // App ready event listener
        window.addEventListener('appReady', (event) => {
            console.log('App is ready!');
            const detail = event.detail;
            if (detail && detail.selectedProfile) {
                selectedProfile = detail.selectedProfile;
                updateLaunchButton();
            }
            loadProfiles();
            loadVersions();
        });

        function startMicrosoftLogin() {
            if (window.app) {
                window.app.startMicrosoftLogin();
                document.getElementById('auth-status').textContent = 'Status: Login gestartet...';
            }
        }

        function startMinecraft() {
            if (window.app && selectedProfile) {
                const result = window.app.launchGame(selectedProfile);
                const status = document.getElementById('launch-status');
                try {
                    const parsed = JSON.parse(result);
                    if (parsed.ok) {
                        status.textContent = 'Spiel wird gestartet...';
                        status.style.color = '#27ae60';
                    } else {
                        status.textContent = 'Fehler: ' + parsed.error;
                        status.style.color = '#e74c3c';
                    }
                } catch (e) {
                    status.textContent = 'Unbekannter Fehler';
                    status.style.color = '#e74c3c';
                }
            }
        }

        function createProfile() {
            const name = document.getElementById('profile-name').value;
            const version = document.getElementById('version-select').value;
            const loader = document.getElementById('loader-select').value;

            if (!name || !version) {
                alert('Bitte Name und Version eingeben');
                return;
            }

            if (window.app) {
                const profileJson = JSON.stringify({name, version, loader});
                const result = window.app.upsertProfileJson(profileJson);
                try {
                    const parsed = JSON.parse(result);
                    if (parsed.ok) {
                        loadProfiles();
                        document.getElementById('profile-name').value = '';
                    } else {
                        alert('Fehler: ' + parsed.error);
                    }
                } catch (e) {
                    alert('Profil-Erstellung fehlgeschlagen');
                }
            }
        }

        function loadProfiles() {
            if (window.app) {
                const profilesJson = window.app.getProfilesJson();
                const profiles = JSON.parse(profilesJson);
                const container = document.getElementById('profiles');
                container.innerHTML = '';

                profiles.forEach(profile => {
                    const div = document.createElement('div');
                    div.className = 'profile-item';
                    div.innerHTML = `
                        <strong>${profile.name}</strong> - ${profile.version} (${profile.loader})
                        <button onclick="selectProfile('${profile.name}')" style="float: right;">Auswählen</button>
                    `;
                    container.appendChild(div);
                });
            }
        }

        function selectProfile(name) {
            if (window.app) {
                const result = window.app.selectProfile(name);
                try {
                    const parsed = JSON.parse(result);
                    if (parsed.ok) {
                        selectedProfile = name;
                        updateLaunchButton();
                    }
                } catch (e) {
                    console.error('Profil-Auswahl fehlgeschlagen', e);
                }
            }
        }

        function updateLaunchButton() {
            const btn = document.getElementById('launch-btn');
            if (selectedProfile) {
                btn.disabled = false;
                btn.textContent = `Starte ${selectedProfile}`;
            } else {
                btn.disabled = true;
                btn.textContent = 'Minecraft starten';
            }
        }

        function loadVersions() {
            console.log('loadVersions() aufgerufen');
            const versionsDiv = document.getElementById('versions');

            if (!window.app) {
                console.error('window.app ist nicht verfügbar');
                versionsDiv.innerHTML = '<p style="color: #e74c3c;">App-Bridge nicht verfügbar</p>';
                return;
            }

            versionsDiv.innerHTML = '<p>Lade Versionen...</p>';

            try {
                console.log('Rufe listMojangVersionsJson() auf...');
                const versionsJson = window.app.listMojangVersionsJson();
                console.log('Erhaltenes JSON:', versionsJson);

                if (!versionsJson || versionsJson.trim() === '') {
                    throw new Error('Leere Antwort erhalten');
                }

                const versions = JSON.parse(versionsJson);
                console.log('Geparste Versionen:', versions);

                if (!Array.isArray(versions)) {
                    throw new Error('Versionen ist kein Array: ' + typeof versions);
                }

                const select = document.getElementById('version-select');
                select.innerHTML = '<option value="">Version wählen...</option>';

                // Nur Release-Versionen anzeigen, auf die ersten 20 begrenzen
                const releases = versions.filter(v => v && v.type === 'release').slice(0, 20);
                console.log('Gefilterte Releases:', releases.length);

                releases.forEach(version => {
                    if (version && version.id) {
                        const option = document.createElement('option');
                        option.value = version.id;
                        option.textContent = version.id;
                        select.appendChild(option);
                    }
                });

                versionsDiv.innerHTML = `<p style="color: #27ae60;">✅ ${releases.length} Versionen geladen</p>`;

                // Loader-Optionen aktualisieren, wenn Version gewählt wird
                select.addEventListener('change', updateLoaderOptions);

            } catch (e) {
                console.error('Versionen laden fehlgeschlagen:', e);
                console.error('Stack trace:', e.stack);
                versionsDiv.innerHTML = `<p style="color: #e74c3c;">❌ Fehler beim Laden der Versionen: ${e.message}</p>`;

                // Fallback: Füge wenigstens eine Test-Version hinzu
                const select = document.getElementById('version-select');
                select.innerHTML = `
                    <option value="">Version wählen...</option>
                    <option value="1.21.4">1.21.4 (Fallback)</option>
                    <option value="1.21.3">1.21.3 (Fallback)</option>
                    <option value="1.21.1">1.21.1 (Fallback)</option>
                `;
            }
        }

        function updateLoaderOptions() {
            const version = document.getElementById('version-select').value;
            const loaderSelect = document.getElementById('loader-select');

            if (window.app && version) {
                try {
                    const loadersJson = window.app.listLoadersFor(version);
                    const loaders = JSON.parse(loadersJson);
                    loaderSelect.innerHTML = '';

                    loaders.forEach(loader => {
                        const option = document.createElement('option');
                        option.value = loader;
                        option.textContent = loader.charAt(0).toUpperCase() + loader.slice(1);
                        loaderSelect.appendChild(option);
                    });
                } catch (e) {
                    console.error('Loader laden fehlgeschlagen', e);
                    loaderSelect.innerHTML = '<option value="vanilla">Vanilla</option>';
                }
            }
        }
    </script>
</body>
</html>
